<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITMD 441 Lab 6</title>
  <link rel="stylesheet" media="screen" href="css/meyers_and_normalize-form_reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Chicago</h1>
    <div class="today-group">
      <h2>Wednesday April 30th, 2025</h2>
      <div class="set1-group">
        <div class="sunrise">
          <img width="25" height="25" src="https://img.icons8.com/ios/50/sunrise--v1.png" alt="sunrise--v1"/>
          <p>time</p>
          <p>Sunrise</p>
        </div>
        <div class="sunset">
          <img width="25" height="25" src="https://img.icons8.com/ios/50/sunset--v1.png" alt="sunset--v1"/>
          <p>time</p>
          <p>Sunset</p>
        </div>
        <div class="dawn">
          <p>time</p>
          <p>Dawn</p>
        </div>
        <div class="dusk">
          <p>time</p>
          <p>Dusk</p>
        </div>
      </div>
      <div class="set2-group">
        <div class="day-length">
          <p>Day Length</p>
        </div>
        <div class="solar-noon">
          <p>Solar Noon</p>
        </div>
        <div class="time-zone">
          <p>Time Zone</p>
        </div>
      </div>
    </div>
    <div class="tomorrow-group">
      <h2>Thursday May 1st, 2025</h2>
      <div class="set1-group">
        <div class="sunrise">
          <img width="25" height="25" src="https://img.icons8.com/ios/50/sunrise--v1.png" alt="sunrise--v1"/>
          <p>time</p>
          <p>Sunrise</p>
        </div>
        <div class="sunset">
          <img width="25" height="25" src="https://img.icons8.com/ios/50/sunset--v1.png" alt="sunset--v1"/>
          <p>time</p>
          <p>Sunset</p>
        </div>
        <div class="dawn">
          <p>time</p>
          <p>Dawn</p>
        </div>
        <div class="dusk">
          <p>time</p>
          <p>Dusk</p>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
